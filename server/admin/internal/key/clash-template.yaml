port: 0
socks-port: 0
redir-port: 0
tproxy-port: 0
mixed-port: 7890
ss-config: ""
vmess-config: ""
inbound-tfo: false
inbound-mptcp: false
authentication: []
skip-auth-prefixes: null
lan-allowed-ips:
  - "0.0.0.0/0"
  - "::/0"
lan-disallowed-ips: null
allow-lan: false
bind-address: "*"
mode: "rule"
unified-delay: true
log-level: "error"
ipv6: true
external-controller: ""
external-controller-pipe: ""
external-controller-unix: ""
external-controller-tls: ""
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
external-ui: ""
external-ui-url: ""
external-ui-name: ""
external-doh-server: ""
secret: ""
interface-name: ""
routing-mark: 0
tunnels: null
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true
geodata-loader: "memconservative"
geosite-matcher: ""
tcp-concurrent: true
find-process-mode: "always"
global-client-fingerprint: "chrome"
global-ua: "FlClash/v0.8.94 clash-verge Platform/linux"
etag-support: true
keep-alive-idle: 30
keep-alive-interval: 30
disable-keep-alive: false
proxy-providers: null
rule-providers: null
proxies:
  - flow: "xtls-rprx-vision"
    name: "新加坡-Xray"
    network: "tcp"
    port: {{XRAY_PORT}}
    server: {{DOMAIN}}
    servername: {{DOMAIN}}
    skip-cert-verify: false
    tls: true
    type: "vless"
    udp: true
    uuid: {{USER_KEY}}
  - down: {{HYSTERIA_DOWN}}
    name: "Hysteria2-secure3"
    password: {{USER_KEY}}
    port: {{HYSTERIA_PORT}}
    server: {{DOMAIN}}
    skip-cert-verify: false
    sni: {{DOMAIN}}
    type: "hysteria2"
    udp: true
    up: {{HYSTERIA_UP}}
proxy-groups:
  - name: "PROXY"
    proxies:
      - "AUTO"
      - "新加坡-Xray"
      - "Hysteria2-secure3"
      - "DIRECT"
    type: "select"
  - interval: 180
    name: "AUTO"
    proxies:
      - "新加坡-Xray"
      - "Hysteria2-secure3"
    tolerance: 50
    type: "url-test"
    url: "http://www.gstatic.com/generate_204"
sub-rules: null
listeners: null
hosts: {}
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  ipv6-timeout: 100
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  fallback:
    - "1.1.1.1"
    - "8.8.8.8"
    - "https://dns.cloudflare.com/dns-query"
  fallback-filter:
    geoip: true
    geoip-code: "CN"
    ipcidr:
      - "240.0.0.0/4"
      - "0.0.0.0/32"
    domain: null
    geosite: []
  listen: "0.0.0.0:1053"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-range6: ""
  fake-ip-filter:
    - "dns.msftnsci.com"
    - "www.msftnsci.com"
    - "www.msftconnecttest.com"
    - "*.lan"
    - "*.local"
    - "time.*.com"
    - "ntp.*.com"
  fake-ip-filter-mode: "blacklist"
  fake-ip-ttl: 1
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  cache-algorithm: ""
  cache-max-size: 0
  nameserver-policy: null
  proxy-server-nameserver: null
  proxy-server-nameserver-policy: null
  direct-nameserver: null
  direct-nameserver-follow-policy: false
ntp:
  enable: false
  server: "time.apple.com"
  port: 123
  interval: 30
  dialer-proxy: ""
  write-to-system: false
tun:
  enable: true
  device: "FlClash"
  stack: "mixed"
  dns-hijack:
    - "any:53"
  auto-route: true
  AutoDetectInterface: true
  inet6-address:
    - "fdfe:dcba:9876::1/126"
  file-descriptor: 0
  recvmsgx: true
  route-address: []
tuic-server:
  enable: false
  listen: ""
  token: null
  certificate: ""
  private-key: ""
  max-idle-time: 15000
  authentication-timeout: 1000
  alpn:
    - "h3"
  max-udp-relay-packet-size: 1500
iptables:
  enable: false
  inbound-interface: "lo"
  bypass: []
  dns-redirect: true
experimental:
  Fingerprints: null
  QUICGoDisableGSO: false
  QUICGoDisableECN: true
  IP4PEnable: false
profile:
  store-selected: false
  store-fake-ip: false
geox-url:
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
  geo-ip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geo-site: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
sniffer:
  enable: false
  override-destination: true
  sniffing: null
  force-domain: []
  skip-src-address: null
  skip-dst-address: null
  skip-domain: []
  port-whitelist: []
  force-dns-mapping: true
  parse-pure-ip: true
  sniff: {}
tls:
  certificate: ""
  private-key: ""
  client-auth-type: ""
  client-auth-cert: ""
  ech-key: ""
  custom-certifactes: null
clash-for-android:
  append-system-dns: false
  ui-subtitle-pattern: ""
rules:
  - "DOMAIN-SUFFIX,local,DIRECT"
  - "IP-CIDR,127.0.0.0/8,DIRECT"
  - "IP-CIDR,172.16.0.0/12,DIRECT"
  - "IP-CIDR,192.168.0.0/16,DIRECT"
